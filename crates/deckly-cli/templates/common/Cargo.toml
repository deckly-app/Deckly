[package]
name = %%crate%%
version = "0.0.1"
edition = "2024"
description = %%description%%
authors = [%%author%%]
%%license_line%%publish = false

%%workspace%%[dependencies]
deckly-sdk = %%sdk%%
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints.clippy]
# Standard output belongs to Deckly: a println! breaks the plugin. Log with
# eprintln!, which Deckly keeps in the plugin's log.
print_stdout = "deny"
